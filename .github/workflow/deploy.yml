name: Build and Push Docker Image

on:
  push:
    branches:
      - "*"

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ansujacr001
  IMAGE_NAME: nodejs-docker-app

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: |
        az acr login --name $ACR_NAME

    - name: Build Docker Image
      run: |
        docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

    - name: Tag Latest
      run: |
        docker tag \
        $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
        $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

    - name: Push Latest
      run: |
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest